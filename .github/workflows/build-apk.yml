name: Build Android (APK + AAB)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply uploaded zip (if any)
        run: |
          ZIP=$(ls *.zip 2>/dev/null | head -1 || true)
          if [ -n "$ZIP" ]; then
            mkdir -p /tmp/upd
            unzip -q -o "$ZIP" -d /tmp/upd
            SRC=$(find /tmp/upd -maxdepth 3 -name settings.gradle.kts -printf '%h\n' | head -1)
            echo "Project folder inside zip: $SRC"
            rsync -a --exclude '.github' "$SRC"/ ./
            rm -f "$ZIP"
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add -A
            git commit -m "Apply project update"
            git push
          fi

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Debug APK + Release AAB
        run: gradle assembleDebug bundleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: iraq-mix-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: iraq-mix-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          
