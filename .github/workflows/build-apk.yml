name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check project zip
        id: chk
        run: |
          if [ -f mx.zip ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            unzip -oq mx.zip -d mx
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "mx.zip not uploaded yet - skipping build"
          fi

      - name: Set up Java
        if: steps.chk.outputs.found == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        if: steps.chk.outputs.found == 'true'
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        if: steps.chk.outputs.found == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        if: steps.chk.outputs.found == 'true'
        run: cd mx && gradle assembleDebug --no-daemon

      - name: Upload APK
        if: steps.chk.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: MX-AI-apk
          path: mx/app/build/outputs/apk/debug/*.apk
          
